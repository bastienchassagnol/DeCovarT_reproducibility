project:
  type: default
  output-dir: _output

lang: en-GB
from: markdown+emoji

# TikZ via the diagram filter already used by the book. The cache key is
# the picture source only. TIKZ_BIN is set in _environment.local.
filters:
  - highlight-text
  - at: pre-ast
    path: _extensions/pandoc-ext/diagram/diagram.lua

revealjs-plugins:
  - quiz

quiz:
  checkKey: "c"
  resetKey: "q"
  shuffleOptions: true
  defaultCorrect: "Correct."
  defaultIncorrect: "Not this one."
  includeScore: false

diagram:
  cache: true
  cache-dir: _diagram-cache
  engine:
    tikz:
      header-includes: |
        \usepackage{amsmath}
        \usepackage{amssymb}
        \usepackage{amsfonts}
        \usepackage{bm}
        \usetikzlibrary{arrows.meta,positioning,fit,backgrounds,calc,shapes.geometric}
        \definecolor{ink}{HTML}{1F2937}
        \definecolor{latfill}{HTML}{DAE9FB}
        \definecolor{latdraw}{HTML}{4477B5}
        \definecolor{obsfill}{HTML}{C9CDD3}
        \definecolor{obsdraw}{HTML}{747B86}
        \definecolor{platedraw}{HTML}{98A2B3}
        \tikzset{
          every node/.style={text=ink},
          const/.style={rectangle, draw=ink, fill=white, minimum size=9mm, line width=0.8pt},
          stoch/.style={circle, draw=latdraw, fill=latfill, minimum size=11mm, line width=0.9pt},
          obs/.style={circle, draw=obsdraw, fill=obsfill, minimum size=11mm, line width=0.9pt},
          det/.style={circle, draw=ink, densely dotted, fill=white, minimum size=11mm, line width=0.9pt},
          plate/.style={draw=platedraw, dashed, rounded corners=5pt, inner sep=4mm, line width=0.8pt},
          platelabel/.style={anchor=north east, font=\small\itshape, text=obsdraw, inner sep=1mm},
          note/.style={font=\small, text=ink!80, align=center},
          edge/.style={-{Stealth[length=2.6mm]}, line width=0.8pt, draw=ink},
          ptitle/.style={font=\bfseries\small, anchor=west}
        }
        \newcommand{\plate}[3]{%
          \begin{scope}[on background layer]
            \node[plate, fit=#2] (#1) {};
          \end{scope}
          \node[platelabel] (#1-lab) at (#1.south east) {#3};}

execute:
  echo: false
  warning: false
  message: false

format:
  revealjs:
    theme: [default, styles.scss]
    slide-level: 2
    slide-number: c/t
    width: 1050
    height: 700
    margin: 0.08
    center: false
    transition: fade
    background-transition: fade
    hash-type: number
    controls: true
    progress: true
    preview-links: auto
    footnotes-hover: true
    code-line-numbers: false
    highlight-style: github
    fig-align: center
    auto-stretch: false
    lightbox:
      match: auto
      effect: zoom
    footer: "DeCovarT reproducibility — Suppinger benchmark"
    title-slide-attributes:
      data-background-color: "#f7f4ef"
    comments:
      hypothesis:
        theme: clean
