project:
  type: default
  output-dir: _output

lang: en-GB
from: markdown+emoji

# TikZ via the diagram filter already used by the book. The cache key is
# the picture source only. TIKZ_BIN is set in _environment.local.
filters:
  - highlight-text
  - at: pre-ast
    path: _extensions/pandoc-ext/diagram/diagram.lua

revealjs-plugins:
  - quiz

quiz:
  checkKey: "c"
  resetKey: "q"
  shuffleOptions: true
  defaultCorrect: "Correct."
  defaultIncorrect: "Not this one."
  includeScore: false

diagram:
  cache: true
  cache-dir: _diagram-cache
  engine:
    tikz:
      header-includes: |
        \usepackage{amsmath}
        \usepackage{amssymb}
        \usepackage{amsfonts}
        \usepackage{bm}
        \usetikzlibrary{bayesnet,arrows.meta,positioning,fit,backgrounds,calc,shapes.geometric}
        \definecolor{ink}{HTML}{1F2937}
        \tikzset{
          every node/.style={text=ink},
          fixed/.style={const, draw, minimum size=7mm, inner sep=2pt},
          note/.style={font=\small, text=ink!80, align=center},
          dependency/.style={-{Stealth[length=2mm]}, semithick},
          ptitle/.style={font=\bfseries\small, anchor=west}
        }

execute:
  echo: false
  warning: false
  message: false

format:
  revealjs:
    theme: [default, styles.scss]
    slide-level: 2
    slide-number: c/t
    width: 1050
    height: 700
    margin: 0.08
    center: false
    transition: fade
    background-transition: fade
    hash-type: number
    controls: true
    progress: true
    preview-links: auto
    footnotes-hover: true
    code-line-numbers: false
    highlight-style: github
    fig-align: center
    auto-stretch: false
    lightbox:
      match: auto
      effect: zoom
    footer: "DeCovarT reproducibility — Suppinger benchmark"
    title-slide-attributes:
      data-background-color: "#f7f4ef"
    comments:
      hypothesis:
        theme: clean
