project:
  type: book
  output-dir: _book

# GitHub shortcodes such as :warning: and :information_source:
from: markdown+emoji

book:
  title: "DeCovarT reproducibility"
  subtitle: "Gastruloid GRNs, feature panels, and sensitivity analyses"
  author: "Bastien Chassagnol"
  date: today
  page-navigation: true
  repo-url: https://github.com/bastienchassagnol/DeCovarT_reproducibility
  repo-branch: main
  repo-subdir: docs
  repo-actions: [edit, source, issue]
  chapters:
    - index.qmd
    - part: "Biological use case"
      chapters:
        - 01-data-suppinger.qmd
    - part: "Reference estimation"
      chapters:
        - 02-feature-selection.qmd
        - 03-covariance-estimation.qmd
    - part: "Deconvolution benchmark"
      chapters:
        - 05-deconvolution-pipeline.qmd
        - 06-biological-insights.qmd
        - 07-sensitivity-misspecification.qmd
  search: true
  navbar:
    search: true
    right:
      - icon: github
        href: https://github.com/bastienchassagnol/DeCovarT_reproducibility
        aria-label: GitHub repository

bibliography:
  - ../bibliography/packages.bib
  - ../bibliography/REFERENCES.bib
link-citations: true

filters:
  - pseudocode
  # pre-ast so Quarto's cross-referencing sees the #fig- labels.
  - at: pre-ast
    path: _extensions/pandoc-ext/diagram/diagram.lua
  # Theorem-style callouts (_extensions/sun123zxy/callouty-theorem, as in
  # the package vignettes) are not loaded for the whole book. A chapter
  # with #thm-, #lem- or #prp- divs enables them in its own YAML header:
  #   filters:
  #     - callouty-theorem
  #   callouty-theorem:
  #     thm:
  #       override-title: false
  #       callout:
  #         type: important

# TikZ graphical models (pandoc-ext/diagram), RevBayes symbol convention.
# No `%` comments inside header-includes: the filter re-wraps that block.
# Flowchart styles (box, keybox, dimbox, choice) reuse the same palette.
# const = fixed square, stoch = latent circle, obs = observed grey circle,
# det = dotted deterministic node, note = equation beside a node.
# The SVG cache is committed, so CI renders without TeX. To compile new
# diagrams, set TIKZ_BIN in docs/_environment.local to the absolute
# path of scripts/tikz-lualatex.sh (LuaLaTeX, then Ghostscript outlines).
# Delete _diagram-cache/ after changing the styles below: the cache key is
# the diagram source only.
diagram:
  cache: true
  cache-dir: _diagram-cache
  engine:
    tikz:
      header-includes: |
        \usepackage{amsmath}
        \usepackage{amssymb}
        \usepackage{amsfonts}
        \usepackage{bm}
        \usetikzlibrary{arrows.meta,positioning,fit,backgrounds,calc,shapes.geometric}
        \definecolor{ink}{HTML}{1F2937}
        \definecolor{latfill}{HTML}{DAE9FB}
        \definecolor{latdraw}{HTML}{4477B5}
        \definecolor{obsfill}{HTML}{C9CDD3}
        \definecolor{obsdraw}{HTML}{747B86}
        \definecolor{platedraw}{HTML}{98A2B3}
        \tikzset{
          every node/.style={text=ink},
          const/.style={rectangle, draw=ink, fill=white, minimum size=9mm, line width=0.8pt},
          stoch/.style={circle, draw=latdraw, fill=latfill, minimum size=11mm, line width=0.9pt},
          obs/.style={circle, draw=obsdraw, fill=obsfill, minimum size=11mm, line width=0.9pt},
          det/.style={circle, draw=ink, densely dotted, fill=white, minimum size=11mm, line width=0.9pt},
          var/.style={ellipse, draw=obsdraw, fill=obsfill, minimum height=9mm, inner xsep=2mm, line width=0.9pt},
          plate/.style={draw=platedraw, dashed, rounded corners=5pt, inner sep=4mm, line width=0.8pt},
          platelabel/.style={anchor=north east, font=\small\itshape, text=obsdraw, inner sep=1mm},
          note/.style={font=\small, text=ink!80},
          edge/.style={-{Stealth[length=2.6mm]}, line width=0.8pt, draw=ink}
        }
        \newcommand{\plate}[3]{%
          \begin{scope}[on background layer]
            \node[plate, fit=#2] (#1) {};
          \end{scope}
          \node[platelabel] (#1-lab) at (#1.south east) {#3};}
        \tikzset{
          box/.style={rectangle, rounded corners=3pt, draw=ink, fill=white, line width=0.8pt, align=flush center, inner sep=2.2mm, font=\small},
          keybox/.style={box, draw=latdraw, fill=latfill},
          dimbox/.style={box, draw=obsdraw, fill=obsfill!45},
          choice/.style={diamond, aspect=2.4, draw=ink, fill=obsfill!35, line width=0.8pt, align=flush center, inner sep=0.6mm, font=\small},
          elabel/.style={font=\footnotesize\itshape, text=ink!85, fill=white, inner sep=1.2pt, align=center},
          dashededge/.style={edge, densely dashed}
        }

pseudocode:
  caption-prefix: "Algorithm"
  reference-prefix: "Algorithm"
  caption-number: true

# freeze: auto stores executed output in docs/_freeze (commit that folder).
# https://quarto.org/docs/projects/code-execution.html#freeze
execute:
  echo: true
  eval: true
  warning: false
  freeze: false

format:
  html:
    # Palette and fonts of the DeCovarT pkgdown site (`template.bslib` in the
    # package _pkgdown.yml), layered on the Bootswatch themes.
    theme:
      light: [cosmo, decovart.scss]
    # tango / nord, as `theme` / `theme-dark` in the package _pkgdown.yml.
    # `syntax-highlighting` is the Quarto 1.10 name; `highlight-style` is
    # its deprecated alias.
    syntax-highlighting:
      light: tango
      dark: nord
    # Wider page than Quarto's default grid (sidebar 250px, body 800px,
    # margin 250px), as the wide container of the pkgdown site.
    grid:
      sidebar-width: 280px
      body-width: 960px
      margin-width: 280px
    toc: true
    toc-depth: 4
    number-sections: true
    number-depth: 3
    # KaTeX 0.16.11, the version the DeCovarT pkgdown site loads. Pandoc
    # loads the method's script with `defer`, but the pseudocode extension
    # renders its algorithms at the end of <body> and needs `katex` defined
    # by then, so the header loads the same version synchronously.
    # Keep the two URLs on one version.
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/"
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  # pdf:
  #   documentclass: scrreprt
  #   toc: true
  #   number-sections: true
