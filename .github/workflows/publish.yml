on:
  workflow_dispatch:
  push:
    branches: [main, master]

name: Quarto Publish

# Prefer Posit Package Manager Linux binaries when they exist for this
# runner (ubuntu-latest is currently Noble). renv rewrites
# packagemanager.posit.co/cran/latest → __linux__/<codename>/latest.
# Local jammy hosts should keep a user ~/.Rprofile with the jammy URL
# (noble binaries need a newer libstdc++).
env:
  RENV_CONFIG_PPM_ENABLED: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # HTML-only book for now (docs/_quarto.yml pdf block commented).
      # Re-enable tinytex: true if the PDF format is restored.
      # https://github.com/quarto-dev/quarto-actions/tree/main/setup#inputs-available
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # Do not use r-lib/actions/setup-r-dependencies here: pak then
      # installs into renv/library and fails with
      # "Unable to move package .../_cache/.../fs" (run 35621930863).
      # System libraries only; R packages come from renv.lock.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglpk-dev \
            libxml2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev

      - name: Restore renv lockfile
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 5

      # Book source is docs/ with execute.freeze: auto (commit docs/_freeze).
      # First local setup: empty commit on gh-pages, then
      # quarto publish gh-pages docs. Pages source: gh-pages /.
      # Actions → Workflow permissions → Read and write.
      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
