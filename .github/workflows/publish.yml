on:
  workflow_dispatch:
  push:
    branches: [main, master]

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # HTML-only book for now (docs/_quarto.yml pdf block commented).
      # Re-enable tinytex: true if the PDF format is restored.
      # https://github.com/quarto-dev/quarto-actions/tree/main/setup#inputs-available
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # setup-renv does not install Linux system libraries (e.g. libglpk-dev for
      # igraph). Resolve requirements from renv.lock with pak before restore.
      # https://pak.r-lib.org/reference/sysreqs_check_installed.html
      - name: Install system requirements (pak)
        shell: bash
        run: Rscript --no-save --no-restore scripts/ci_sysreqs.R install

      - name: Install R dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2

      - name: Verify system requirements (pak)
        shell: bash
        run: Rscript --no-save --no-restore scripts/ci_sysreqs.R check

      # Book source is docs/ with execute.freeze: auto (commit docs/_freeze).
      # First local setup: empty commit on gh-pages, then
      # quarto publish gh-pages docs. Pages source: gh-pages /.
      # Actions → Workflow permissions → Read and write.
      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
